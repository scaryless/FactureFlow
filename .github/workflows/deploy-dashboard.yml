name: Deploy FactureFlow dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factureflow-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production dashboard
        run: npm run build
      - name: Publish to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FACTUREFLOW_FTP_SERVER }}
          username: ${{ secrets.FACTUREFLOW_FTP_USERNAME }}
          password: ${{ secrets.FACTUREFLOW_FTP_PASSWORD }}
          local-dir: ./dashboard/dist/
          server-dir: factureflow.evolutionb.ca/
          exclude: |
            **/.git*
            **/.git*/**
